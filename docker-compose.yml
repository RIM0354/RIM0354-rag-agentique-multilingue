services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: ./backend
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - hf_models:/models
    depends_on:
      - qdrant
    profiles: ["full"]   # lancé avec : docker compose --profile full up

volumes:
  qdrant_data:
  hf_models:
